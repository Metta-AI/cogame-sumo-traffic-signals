  canvas.addEventListener('gestureend', function (ev) {
    ev.preventDefault();
    gesturing = false;
  });

  // Touchscreen pinch. #board's touch-action leaves one-finger panning to the
  // page while it is fitted (so the board never traps a scroll) and takes it
  // back once zoomed in, where a drag has somewhere to go; pinch-zoom is never
  // in that list, so a second finger always arrives here as a pointer.
  var pinch = new Map();          // pointerId -> {x, y}
  var pinchSpan = 0, pinchMidX = 0, pinchMidY = 0;
  function pinchGeometry() {
    var pts = Array.from(pinch.values());
    var dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
    return {
      span: Math.max(1, Math.hypot(dx, dy)),
      midX: (pts[0].x + pts[1].x) / 2,
      midY: (pts[0].y + pts[1].y) / 2
    };
  }
  function beginPinch() {
    var g = pinchGeometry();
    pinchSpan = g.span;
    pinchMidX = g.midX;
    pinchMidY = g.midY;
    dragging = false;             // two fingers is a pinch, not a drag
  }

  function syncTouchAction(t) {
    // Fitted: the page owns one-finger drags. Zoomed: the board does.
    canvas.style.touchAction = (t && t.zoom > 1) ? 'none' : 'pan-x pan-y';
  }

  canvas.addEventListener('pointerdown', function (ev) {
    if (ev.pointerType === 'touch') {
      pinch.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pinch.size === 2) { beginPinch(); return; }
      if (pinch.size > 2) return;
    }
    if (ev.button !== 0) return;
    dragging = true;
    dragMoved = 0;
    lastDragX = ev.clientX;
    lastDragY = ev.clientY;
  });
  window.addEventListener('pointermove', function (ev) {
    if (pinch.has(ev.pointerId)) {
      pinch.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pinch.size === 2) {
        var g = pinchGeometry();
        var rect = canvas.getBoundingClientRect();
        // Zoom by how much the fingers spread, then pan by how far the pair
        // travelled, so the board tracks the hand instead of only the spread.
        core.zoomAt(g.span / pinchSpan, g.midX - rect.left, g.midY - rect.top);
        core.panBy(g.midX - pinchMidX, g.midY - pinchMidY);
        pinchSpan = g.span;
        pinchMidX = g.midX;
        pinchMidY = g.midY;
        dragMoved = 999;          // a pinch must never also select a cog
        return;
      }
    }
    if (!dragging) return;
    var dx = ev.clientX - lastDragX, dy = ev.clientY - lastDragY;
    lastDragX = ev.clientX;
    lastDragY = ev.clientY;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    core.panBy(dx, dy);

    canvas.style.cursor = t && t.zoom > 1 ? 'grabbing' : '';
  });
  function endPointer(ev) {
    if (ev && pinch.has(ev.pointerId)) {
      pinch.delete(ev.pointerId);
      if (pinch.size === 2) beginPinch();
    }

    canvas.style.cursor = '';
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  // ---- view controls: zoom cluster + minimap ----------------------------
  var ZOOM_STEP = 1.35;     // one button press / one z or x key
  var SLIDER_TRAVEL = 1000;
  // One arrow press, in LOGICAL map pixels — a fixed cell of ground. 64px is
  // eight of the engine's fog-of-war cells (FovCellSize) and a bit over five
  // cog widths: ~19 cells across the 1235px arena, ~39 across a 2496px 4-team
  // board, so shift (ten cells) crosses either in a couple of presses while a
  // single press is still a step you can aim with.
  var PAN_CELL_MAP_PX = 64;

  // The view is measured in BOARD pixels and a cell is defined in WORLD pixels,
  // and the two differ by the board's supersample factor — which is per-board
  // (an oversize map renders 1x, a normal one at RenderScale), so the server
  // states it per frame as `bs`. Falling back to 1 makes an un-stated board
  // step a cell of board pixels: smaller ground per press, never a broken key.
  function panCellBoardPx() {
    var bs = lastState && lastState.bs > 0 ? lastState.bs : 1;
    return PAN_CELL_MAP_PX * bs;
  }
  // The zoom bar and the board inset are DROPPED in this fork: the board is a
  // fixed 34 x 26 cell city with no off-frame area, so there is nothing to
  // locate and nothing to zoom toward. What survives is the one rule the
  // panel did not own — whether a one-finger drag belongs to the page.
  function syncViewUi(t) {
    syncTouchAction(t || core.getTransform());
  }

  canvas.addEventListener('dblclick', function (ev) {
    ev.preventDefault();
    core.resetView();
  });

  canvas.addEventListener('click', function (ev) {
    // A pan is not a click: dragging the board must never also select the cog
    // that happened to be under the pointer when the drag ended.
    if (dragMoved > 4) { dragMoved = 0; return; }
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    // getBoundingClientRect is CSS px; the core's transform lives in the same
    // CSS space (offsetX/offsetY/scale are computed against clientWidth/Height,
    // NOT the dpr-scaled backing store), so no devicePixelRatio factor here.
    var cssX = ev.clientX - rect.left;
    var cssY = ev.clientY - rect.top;
    var t = core.getTransform();
    if (!t || !t.scale) return;
    var mapX = Math.round((cssX - t.offsetX) / t.scale);
    var mapY = Math.round((cssY - t.offsetY) / t.scale);
    // Ignore clicks in the letterbox bands (outside the drawn map).
    if (mapX < 0 || mapY < 0 || mapX >= t.nativeW || mapY >= t.nativeH) return;
    core.clickMap(mapX, mapY);
  });

  // ============================================================
  //  Fixed-aspect fit: size the composition to the board's native aspect
  //  inside the embed box, then scale the whole thing (board + overlays) as
  //  one unit. Chrome sizes off the STAGE width, so overlays stay locked to
  //  the graphics at any container shape (§2, L82 bounded-embed).
  // ============================================================
  function relayout() {
    var boxW = viewport.clientWidth, boxH = viewport.clientHeight;
    if (!boxW || !boxH) return;
    // The board region (game action) fits the board aspect into the box BETWEEN a
    // reserved top band (the scorebug) and bottom band (the transport), so neither
    // ever sits over play. Each band's pixel height depends on --hudscale (→ board
    // width) and the board fit depends on the bands, so iterate to a FIXED POINT:
    // stop as soon as a pass measures the same bands it was laid out with. Two
    // passes settle a container resize, but a MAP-ASPECT change (the 1.874:1
    // arena → a square four-team board) swings --hudscale far enough that the
    // second pass is still reserving the old bands, which would leave the board
    // a couple of percent off its true aspect — visible as thin dead strips.
    var scorebug = document.getElementById('scorebug');
    var transport = document.getElementById('transport');
    var root = document.documentElement;
    var topBand = parseFloat(getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var band = parseFloat(getComputedStyle(root).getPropertyValue('--band')) || 0;
    var stageW = 0, stageH = 0;
    for (var pass = 0; pass < 4; pass++) {
      var prevTop = topBand, prevBand = band;
      var availH = Math.max(1, boxH - topBand - band);
      var boardW, boardH;
      if (boxW / availH > BOARD_ASPECT) {
        boardH = availH; boardW = Math.round(availH * BOARD_ASPECT);
      } else {
        boardW = boxW; boardH = Math.round(boxW / BOARD_ASPECT);
      }
      stageW = boardW; stageH = boardH + topBand + band;
      stage.style.width = stageW + 'px';
      stage.style.height = stageH + 'px';
      // One scale for the whole composition: chrome was authored against a
      // ~760px-wide reference board, so --hudscale is the board's on-screen width
      // over that reference (clamped so a huge featured embed doesn't bloat the
      // chrome and a tiny 360px floor stays legible).
      var scale = Math.max(0.5, Math.min(1.6, boardW / 760));
      root.style.setProperty('--hudscale', scale.toFixed(3));
      stage.classList.toggle('tiny', boardW <= 620);
      // Measure each band's natural height → reserve exactly that.
      topBand = scorebug ? scorebug.offsetHeight : 0;
      band = transport ? transport.offsetHeight : 0;
      root.style.setProperty('--topband', topBand + 'px');
      root.style.setProperty('--band', band + 'px');
      if (Math.abs(topBand - prevTop) < 0.5 && Math.abs(band - prevBand) < 0.5) break;
    }
    core.setViewportFit();
  }
  var ro = new ResizeObserver(relayout);
  ro.observe(viewport);
  window.addEventListener('resize', relayout);

  // The context the appended PAINTBALL block reads the classic chrome
  // through. Declared here (hoisted `var`, so onFrame sees it however early
  // the first frame lands) rather than duplicating any of it: the game block
  // must not re-implement naming, escaping, feed insertion or the transport.
  PB_CTX = {
    $: $, C: C, esc: esc, fmt: fmt, send: send,
    teamCol: teamCol, activeTeams: activeTeams, teamOf: teamOf,
    teamName: teamName, rosterName: rosterName, shortName: shortName,
    pushFeed: pushFeed, banner: banner, togglePov: togglePov,
    getState: function () { return lastState; }
  };
  if (window.SignalsChrome) window.SignalsChrome.install(PB_CTX);

  relayout();
  core.start();
})();
</script>
<!-- ============================================================

     ============================================================
     Everything above this banner is the classic coworld-ctf broadcast page,
     edited only where the game demands and always behind SIG_MODE: the
     scorebug plates' CONTENTS, the feed and beat routing, and the endcard's
     stat columns. SIG_MODE latches on the first frame that carries a `city`
     field — a classic replay never enters any of it.

     The classic view panel (zoom bar plus board inset) and the first-person
     picture-in-picture are REMOVED, markup, CSS and wiring: the board is a
     fixed 34 x 26 cell city with no off-frame area, relayout() letterboxes it
     whole at every width, and there is no per-car point of view worth showing
     — the city is the shot.

     Nothing here touches the transport band. relayout() still owns --hudscale,
     --topband and --band on :root; the endcard still stops at
     bottom: var(--band, 0px) and is still dismissed by every seek; and every
     scrubber beat this block draws is a LABELLED, CLICKABLE BUTTON that seeks
     on click, styled for EVERY kind the sim emits — wave, spillback, gridlock,

<script>
(function () {
  'use strict';

  var CTX = null;
  var $ = function (id) { return document.getElementById(id); };
  var built = false;
  var beatsPlaced = false;
  var seenBeats = {};
  var lastTiny = null;
  var lastExitLine = 0;

  // Named sigEsc, not `esc`: the chrome alias block declares an `esc` and a
  // same-named function in this scope would be hoisted over it.
  function sigEsc(t) { return CTX ? CTX.esc(t) : String(t); }

  function build() {
    if (built) return;
    built = true;
    var bug = $('scorebug');
    if (!bug) return;
    var rail = document.createElement('div');
    rail.id = 'sigrail';
    rail.innerHTML =
      '<div id="sigpressure"></div>' +
      '<div id="sigtally"></div>' +
      '<div id="sigchips">' +
      '<span class="sig-chip" id="chip-spill">Spillback <span class="spill-list"></span></span>' +
      '<span class="sig-chip" id="chip-ring">Gridlock <span class="ring-list"></span><span class="ring-ticks"></span></span>' +
      '</div>';
    bug.appendChild(rail);
  }

  // ---- scrubber beats -----------------------------------------------------
  // Named cityBeat, and deliberately NOT the chrome's own beat-marker name:
  // the alias block aliases that name onto the shared chrome, and a same-named
  // function in this scope would be HOISTED over it (the tandem 2026-08-23
  // trap). Every marker is a labelled, clickable button that seeks on click.
  function cityBeat(tick, kind, slot, label) {
    var key = tick + '|' + kind;
    if (seenBeats[key]) return;
    seenBeats[key] = true;
    var scrub = $('scrub');
    var s = CTX && CTX.getState ? CTX.getState() : null;
    if (!scrub || !s) return;
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    var frac = Math.min(1, Math.max(0, (tick - st) / (mx - st)));
    var b = document.createElement('button');
    b.className = 'beat-marker ' + kind + (slot >= 0 ? ' ' + colourOf(slot) : '');
    b.style.left = (frac * 100) + '%';
    b.title = label;
    b.setAttribute('aria-label', label);
    b.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (CTX) CTX.send('s:' + tick);
    });
    scrub.appendChild(b);
  }

  var COLOURS = ['red', 'blue', 'green', 'yellow'];
  var ALIASES = ['ALPHA', 'BETA', 'GAMMA', 'DELTA'];
  function colourOf(slot) { return COLOURS[slot] || ''; }
  function aliasOf(slot) { return ALIASES[slot] || ('SEAT ' + slot); }

  function placeBeats(s) {
    if (beatsPlaced || !s.citybeats) return;
    beatsPlaced = true;
    for (var i = 0; i < s.citybeats.length; i++) {
      var b = s.citybeats[i];
      cityBeat(b.t, b.k, b.slot == null ? -1 : b.slot, b.label || b.k);
    }
  }

  // ---- the queue-pressure rail -------------------------------------------
  // Four rows, one per controller, sorted by waiting ASCENDING (best first),
  // so a controller losing control of its quadrant is visible as its bar
  // overtaking.
  function renderPressure(s) {
    var host = $('sigpressure');
    if (!host) return;
    var rows = [];
    var total = 0;
    for (var slot = 0; slot < 4; slot++) {
      var r = (s.roster || []).filter(function (p) { return p.s === slot; })[0] || {};
      var wait = r.wait || 0;
      total += wait;
      rows.push({ slot: slot, name: r.name || aliasOf(slot), served: r.served || 0, wait: wait, fb: r.fb || 0 });
    }
    rows.sort(function (a, b) { return a.wait - b.wait || a.slot - b.slot; });
    var key = rows.map(function (r) { return r.slot; }).join(',');
    if (host._key !== key) {
      host._key = key;
      host.innerHTML = '';
      host._rows = {};
      rows.forEach(function (r) {
        var el = document.createElement('div');
        el.className = 'pr-row ' + colourOf(r.slot);
        el.innerHTML =
          '<i class="pr-chip" style="background:currentColor"></i>' +
          '<span class="pr-alias">' + aliasOf(r.slot) + '</span>' +
          '<span class="pr-name"></span>' +
          '<span class="pr-served"></span>' +
          '<span class="pr-wait"></span>' +
          '<span class="pr-bar"><i></i></span>';
        host.appendChild(el);
        host._rows[r.slot] = el;
      });
    }
    rows.forEach(function (r) {
      var el = host._rows[r.slot];
      if (!el) return;
      el.querySelector('.pr-name').textContent =
        r.name + (r.fb > 0 ? ' \u21af' : '');
      el.querySelector('.pr-served').textContent = r.served + ' out';
      el.querySelector('.pr-wait').textContent = r.wait + ' car-s';
      var share = total > 0 ? Math.round(r.wait * 100 / total) : 0;
      el.querySelector('.pr-bar i').style.width = share + '%';
    });
  }

  // ---- the corridor tally: a miniature time-space diagram ----------------
  function renderTally(s) {
    var host = $('sigtally');
    if (!host || !s.tally) return;
    if (host._n !== s.tally.length) {
      host._n = s.tally.length;
      host.innerHTML = '';
      host._bars = [];
      s.tally.forEach(function (t) {
        var el = document.createElement('div');
        el.className = 'tl-bar';
        el.title = (t.axis === 'row' ? 'Row ' : 'Column ') + t.label + ' arterial';
        el.innerHTML = '<span class="tl-pips"></span>' +
          '<span class="tl-label">' + sigEsc(t.label) + '</span>' +
          '<span class="tl-waves"></span>';
        host.appendChild(el);
        host._bars.push(el);
      });
    }
    s.tally.forEach(function (t, i) {
      var el = host._bars[i];
      if (!el) return;
      var pips = el.querySelector('.tl-pips');
      var want = (t.pips || []).length;
      while (pips.children.length < want) pips.appendChild(document.createElement('i'));
      (t.pips || []).forEach(function (phase, j) {
        var pip = pips.children[j];
        pip.className = 'tl-pip ' +
          (phase === 'CLR' ? 'clr' : (phase === 'NSG' || phase === 'NSL') ? 'ns' : 'ew');
        pip.title = phase;
      });
      el.querySelector('.tl-waves').textContent = t.waves > 0 ? String(t.waves) : '';
    });
  }

  function renderChips(s) {
    var spill = $('chip-spill');
    var ring = $('chip-ring');
    if (spill) {
      var list = (s.spill || []);
      spill.classList.toggle('on', list.length > 0);
      spill.querySelector('.spill-list').textContent = list.join(' \u00b7 ');
    }
    if (ring) {
      var links = (s.ring || []);
      ring.classList.toggle('on', links.length > 0);
      ring.querySelector('.ring-list').textContent = links.slice(0, 2).join(' \u00b7 ') +
        (links.length > 2 ? ' +' + (links.length - 2) : '');
      ring.querySelector('.ring-ticks').textContent =
        links.length > 0 ? ' ' + (s.ringTicks || 0) + 's' : '';
    }
  }

  // ---- the clock column --------------------------------------------------
  function renderClockCol(s) {
    var big = $('clock-time');
    var cap = $('clock-caption');
    if (big && s.ph !== 'lobby') {
      big.textContent = 'THROUGH ' + (s.through || 0);
      big.title = (s.through || 0) + ' of ' + (s.demand || 0) + ' cars out, par ' + (s.par || 0);
    }
    if (cap && s.ph !== 'lobby') {
      cap.textContent = 'demand ' + (s.demand || 0) + ' \u00b7 waiting ' + (s.waiting || 0) +
        ' \u00b7 spillback ' + ((s.spill || []).length) +
        ' \u00b7 gridlock ' + ((s.ring || []).length ? 1 : 0) +
        ' \u00b7 waves ' + (s.waves || 0);
    }
  }

  // ---- density: tell the module when the board must draw its tiny readout --
  function syncTiny() {
    var tiny = !!($('stage') && $('stage').classList.contains('tiny'));
    if (tiny === lastTiny) return;
    lastTiny = tiny;
    if (CTX) CTX.send(tiny ? 't:1' : 't:0');
  }

  // ---- the feed: plain language, never internal notation -----------------
  function feed(html, cls) {
    if (!CTX) return;
    var row = document.createElement('div');
    row.className = 'feed-row' + (cls ? ' ' + cls : '');
    row.innerHTML = html;
    CTX.pushFeed(row);
  }

  function who(slot) {
    return '<span class="who ' + colourOf(slot) + '">' + aliasOf(slot) + '</span>';
  }

  function sigEvent(e, s, ctx) {
    CTX = CTX || ctx;
    switch (e.k) {
      case 'order':
        feed(who(e.slot) + '<span class="glyph">\u25b8</span>' +
          '<span class="badge">' + sigEsc(e.at) + ' ' + orderWords(e) + '</span>');
        return true;
      case 'say':
        feed(who(e.slot) + '<span class="glyph">\u25b8</span>' +
          '<span class="badge">radio: "' + sigEsc(e.text) + '"</span>', 'radiorow');
        return true;
      case 'wave':
        cityBeat(e.t, 'wave', -1, 'green wave on ' + e.corridor + ' — click to jump here');
        CTX.banner(('row ' + e.corridor + ' ' + e.dir + ' wave — ' +
          e.vehicles + ' cars, 4 signals clean').toUpperCase(), 'wipe accent green');
        feed('<span class="badge">' + sigEsc(String(e.corridor)) + ' ' + sigEsc(String(e.dir)) +
          ' WAVE \u2014 ' + e.vehicles + ' CARS</span>');
        return true;
      case 'spillback':
        cityBeat(e.t, 'spillback', e.slot, sigEsc(e.link) + ' filled up — click to jump here');
        feed('<span class="badge">SPILLBACK ' + sigEsc(e.link) + ' \u2014 ' +
          aliasOf(e.slot) + "'S BLOCK IS FULL</span>");
        return true;
      case 'gridlock':
        cityBeat(e.t, 'gridlock', -1, 'gridlock ring — click to jump here');
        CTX.banner('GRIDLOCK \u2014 ' + (e.ats || []).slice(0, 4).join(' \u00b7 ') +
          ' RING', 'steal accent red');
        feed('<span class="badge">GRIDLOCK \u2014 ' +
          sigEsc((e.links || []).slice(0, 4).join(' \u00b7 ')) + ' RING</span>');
        return true;
      case 'gridlockclear':
        CTX.banner('GRIDLOCK BROKEN \u2014 ' +
          sigEsc((e.links || [])[0] || '') + ' DRAINED', 'returned accent green');
        return true;
      case 'starve':
        feed('<span class="badge">' + sigEsc(e.at) + ' STARVED \u2014 ' +
          sigEsc(e.approach) + ' LANE BLOCKED, CITY FORCED THE PHASE</span>');
        return true;
      case 'gatejam':
        feed('<span class="badge">' + sigEsc(e.gate) +
          ' GATE QUEUE FULL \u2014 TURNING CARS AWAY</span>');
        return true;
      case 'exit':
        // ~400 exits an episode: print one line every 25th car so the feed
        // never floods.
        if (e.total && e.total - lastExitLine >= 25) {
          lastExitLine = e.total;
          feed('<span class="badge">' + e.total + ' CARS THROUGH</span>');
        }
        return true;
      case 'fallback':
        cityBeat(e.t, 'fallback', e.slot,
          aliasOf(e.slot) + ' missed the call — click to jump here');
        feed(who(e.slot) + '<span class="glyph">\u25b8</span>' +
          '<span class="badge tk">MISSED THE CALL \u2014 greedy phases (' +
          sigEsc(e.cause) + ')</span>');
        return true;
      case 'end':
        cityBeat(e.t || 0, 'end', -1, 'the city settles — click to jump here');
        return true;
      case 'turn':
      case 'phasechange':
      case 'spillclear':
      case 'gateclear':
        return true;
    }
    return false;
  }

  function orderWords(e) {
    if (e.verb === 'hold') return 'holds';
    if (e.verb === 'auto') return 'runs the greedy actuator';
    if (e.verb === 'phase') return '\u2192 ' + e.phase + ' (' + greenWords(e.phase) + ')';
    return '\u2192 ' + e.phase + ' at +' + e.delay + ' (offset)';
  }
  function greenWords(phase) {
    if (phase === 'NSG') return 'north-south green';
    if (phase === 'NSL') return 'north-south left';
    if (phase === 'EWG') return 'eastbound green';
    return 'east-west left';
  }

  function sigFrame(s, ctx, jumped) {
    CTX = CTX || ctx;
    build();
    if (jumped) {
      lastExitLine = 0;
    }
    placeBeats(s);
    renderPressure(s);
    renderTally(s);
    renderChips(s);
    renderClockCol(s);
    syncTiny();
  }

  window.SignalsChrome = {
    install: function (ctx) { CTX = ctx; build(); },
    frame: sigFrame,
    event: sigEvent
  };
})();
</script>

</body>
</html>
